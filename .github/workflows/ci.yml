name: Pipeline CI/CD

on:
  push:
    branches:
      - '**'

jobs:
  # --- 1. ETAPA TEST ---
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout del codigo
        uses: actions/checkout@v4
      
      - name: configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: ejecucion de pruebas
        run: mvn test

  # --- 2. ETAPA BUILD ---
  build:
    name: build jar
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout de codigo
        uses: actions/checkout@v4
      
      - name: configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: generar el jar
        run: mvn clean package -DskipTests

      - name: subir JAR como artifact 
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

# --- 3. ETAPA DOCKER-BUILD ---
  docker-build:
    name: build & push docker image
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: checkout de codigo
        uses: actions/checkout@v4

      - name: descargar JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen
        run: |
          IMAGE="${{ vars.IMAGE_NAME }}"
          docker build -t $IMAGE:latest -t $IMAGE:$SHORT_SHA .
          docker push $IMAGE:latest
          docker push $IMAGE:$SHORT_SHA
          
# --- 4. ETAPA DEPLOY ---
  deploy:
    name: deploy
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Ejecutar despliegue via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull ${{ vars.IMAGE_NAME }}:latest
            docker stop app-${{ secrets.SSH_USER }} || true
            docker rm app-${{ secrets.SSH_USER }} || true
            docker run -d \
              --name app-${{ secrets.SSH_USER }} \
              --restart unless-stopped \
              -p ${{ vars.APP_PORT }}:3001 \
              ${{ vars.IMAGE_NAME }}:latest
  
